BOARD=orangepi5
BRANCH=current
RELEASE=trixie
BUILD_DESKTOP=no
BUILD_MINIMAL=yes
KERNEL_CONFIGURE=no
enable_extension "carotos-aul-icewm"

# Marka: /etc/os-release (PRETTY_NAME, HOME_URL...), /etc/issue, /etc/armbian-release ve .deb Maintainer alani.
# Belge: https://docs.armbian.com/build-framework/switches/branding/
# Varsayilan "Armbian-unofficial" yerine CarotOS-AUL kimligi kullanilir.
declare -g VENDOR="CarotOS-AUL"
declare -g VENDORURL="https://carotos.org"
declare -g VENDORDOCS="https://github.com/MiracLight/CarotOS-AUL"
declare -g VENDORSUPPORT="https://github.com/MiracLight/CarotOS-AUL/issues"
declare -g VENDORBUGS="https://github.com/MiracLight/CarotOS-AUL/issues"
declare -g MAINTAINER="MiracLight"
declare -g MAINTAINERMAIL="carotosproject@gmail.com"
